protocol_version: mits-revision-20261011-v1
data_version: final-grouped-split
data_root: /path/to/prepared_dataset
report_root: /path/to/protocols
output_root: /path/to/output
tasks: [reentrancy, timestamp, integeroverflow, delegatecall]
splits: [train, validation, test]
seeds: [17, 29, 43, 71, 101]
split_seed: 20261010
bytecode_type: creation
model:
  vocab_size: 165
  dim: 512
  seq_embedding: 256
  seq_hidden: 256
  seq_layers: 2
  graph_steps: 2
  source_dim: 768
  source_layers: 2
  graph_dropout: 0.5
  seq_dropout: 0.3
  source_dropout: 0.5
  fusion_dropout: 0.5
  node_dropout: 0.2
  node_encoder: conv
  kernel_size: 2
  node_inner: null
  branches: [graph, sequence, derived]
training:
  epochs: 100
  batch_size: 16
  learning_rate: 0.0001
  patience: 20
  selection: val_f1
  tie_policy: earliest
  threshold: 0.5
  weighted_sampling: true
  device: auto
distillation:
  loss_type: feature_kl
  alpha: 1.0
  beta: 0.5
  temperature: 2.0
  position: post_dropout
  reduction: paired_sample_mean
node_max_length: 50
sequence_max_length: 512
source_max_length: 512
source_encoder: microsoft/graphcodebert-base
source_encoder_local: null
source_strategy: truncate
